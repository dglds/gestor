[package]
name = "finance"
version = "1.0.0"
description = "Controle financeiro pessoal simples com visual neo-brutalista"
authors = ["Diego"]
edition = "2021"

[lib]
name = "finance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
